name: Claude discussion

on:
  schedule:
    - cron: "17 9 * * *" # Daily at 09:17 UTC
  workflow_dispatch:
    inputs:
      config_path:
        description: Path to the discussion JSON config
        required: true
        default: config.json
        type: string

permissions:
  contents: read

jobs:
  discuss:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code
      - name: Run discussion
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DISCUSSION_CONFIG_JSON: ${{ secrets.DISCUSSION_CONFIG_JSON }}
          CONFIG_PATH: ${{ inputs.config_path || 'config.json' }}
        run: |
          if [ -n "$DISCUSSION_CONFIG_JSON" ]; then
            mkdir -p "$(dirname "$CONFIG_PATH")"
            printf '%s' "$DISCUSSION_CONFIG_JSON" > "$CONFIG_PATH"
          fi
          python claude_discuss.py --config "$CONFIG_PATH" --once
      - name: Preserve transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-discussion-transcript
          path: transcripts/discussions.jsonl
          if-no-files-found: ignore
          retention-days: 14
